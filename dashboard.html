<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Dashboard</title>
  </head>
  <body>
    <!-- DASHBOARD -->
    <div class="main-container">
      <div class="hamburger" onclick="toggleMenu()">☰</div>
      <aside class="sidebar">
        <!-- imagen -->
        <div>
          <img class="image" src="./img/mediCheck.jpg" alt="Logo MediCheck" />
        </div>

        <hr />

        <ul>
          <li class="active">
            <i class="fa-solid fa-table-columns"></i> Dashboard
          </li>
          <li>
            <i class="fa-solid fa-hospital-user"></i>
            <a href="pacientes.html">Pacientes</a>
          </li>
          <li>
            <a href="index.html"><i class="fa-solid fa-user-plus"></i> Citas</a>
          </li>
          <li>
            <a href="historial.html">
              <i class="fa-solid fa-laptop-medical"></i> Historial Médico</a
            >
          </li>
          <li>
            <i class="fa-solid fa-receipt"></i>
            <a href="facturacion.html">Facturación</a>
          </li>
          <li>
            <i class="fa-solid fa-notes-medical"></i>
            <a href="reportes.html">Reportes</a>
          </li>
        </ul>
        <hr />
        <button onclick="cerrarSesion()">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
      </aside>

      <section class="content">
        <h2>Bienvenido/a, Walquidia Cruz 👋</h2>

        <div class="stats-cards">
          <div class="card">
            <h4>Pacientes</h4>
            <p>120</p>
          </div>
          <div class="card">
            <h4>Citas Hoy</h4>
            <p>8</p>
          </div>
          <div class="card">
            <h4>Ingresos del Mes</h4>
            <p>$1,750.00</p>
          </div>
          <div class="card">
            <h4>Reportes Pendientes</h4>
            <p>3</p>
          </div>
        </div>

        <div class="quick-links">
          <h3>Accesos Rápidos</h3>
          <div class="links">
            <button>📋 <a href="pacientes.html">Ver Pacientes</a></button>
            <button>➕ <a href="index.html">Nueva Citas</a></button>
            <button>💵 <a href="facturacion.html">Ver Facturas</a></button>
            <button>📊 <a href="reportes.html">Generar Reportes</a></button>
          </div>
        </div>
      </section>
    </div>
    <!-- FIN DASHBOARD -->
    <footer><p>&copy; 2025 Crixfer. Todos los derechos reservados.</p></footer>
    <script src="index.js"></script>
  </body>
</html>
