<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>MediCheck</title>
  </head>
  <body>
    <!-- AGENDA DE CITAS -->
    <div class="main-container">
      <div class="hamburger" onclick="toggleMenu()">☰</div>
      <aside class="sidebar">
        <!-- imagen -->
        <div>
          <img class="image" src="./img/mediCheck.jpg" alt="Logo MediCheck" />
        </div>

        <hr />

        <ul>
          <li>
            <i class="fa-solid fa-table-columns"></i>
            <a href="dashboard.html">Dashboard</a>
          </li>
          <li>
            <i class="fa-solid fa-hospital-user"></i>
            <a href="pacientes.html">Pacientes</a>
          </li>
          <li class="active"><i class="fa-solid fa-user-plus"></i> Citas</li>
          <li>
            <i class="fa-solid fa-laptop-medical"></i>
            <a href="historial.html">Historial Médico</a>
          </li>
          <li>
            <i class="fa-solid fa-receipt"></i>
            <a href="facturacion.html">Facturación</a>
          </li>
          <li>
            <i class="fa-solid fa-notes-medical"></i>
            <a href="reportes.html">Reportes</a>
          </li>
        </ul>
        <hr />
        <button onclick="cerrarSesion()">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
      </aside>

      <section class="content">
        <h2>Agendar Cita</h2>

        <form class="form-cita">
          <label>Paciente</label>
          <input type="text" placeholder="Carlos López" />

          <div class="grid">
            <div>
              <label>Fecha</label>
              <input type="date" value="2024-04-18" />
            </div>
            <div>
              <label>Hora</label>
              <input type="time" value="09:00" />
            </div>
          </div>

          <label>Motivo</label>
          <textarea placeholder="Consulta de seguimiento"></textarea>

          <button>Agendar</button>
        </form>
      </section>
    </div>
    <!-- FIN AGENDA DE CITAS -->
    <footer><p>&copy; 2025 Crixfer. Todos los derechos reservados.</p></footer>
    <script src="index.js"></script>
  </body>
</html>
